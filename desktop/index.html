<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'" />
  <title>PipeLingo</title>
  <style>
    :root {
      --bg: #101418;
      --panel: #1a2028;
      --panel-2: #212a34;
      --text: #e8eef4;
      --muted: #8a97a5;
      --accent: #4f8cff;
      --green: #35c282;
      --red: #ff5d5d;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .titlebar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 88px; /* space for traffic lights */
      -webkit-app-region: drag;
    }
    .titlebar h1 { font-size: 15px; font-weight: 600; }
    .titlebar .status {
      font-size: 12px;
      color: var(--muted);
      -webkit-app-region: no-drag;
    }
    .wrap { padding: 10px 22px 22px; display: flex; flex-direction: column; gap: 14px; height: calc(100vh - 44px); }
    .card {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .line-cards { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .line-card .field { display: grid; grid-template-columns: 470px 1fr; column-gap: 36px; row-gap: 22px; align-items: center; }
    .line-card .field > label,
    .line-card .field > div > label { grid-column: 1 / -1; }
    .line-card .field select { width: 100%; }
    .line-card .meters { margin: 8px 0 0; display: block; }
    .line-card .meters .meter { width: 100%; display: block; }
    .line-card .field .line-note { grid-column: 1 / -1; }
    .line-card .field input[type="checkbox"] + *,
    .line-card .field > label[style*="align-items:center"] { grid-column: 1 / -1; }
    .line-card .field > label { margin: 0; }
    .line-card .meters { margin: 0; }
    .line-card .meters .meter-label { width: 56px; }
    .line-card select { width: 100%; }
    .line-card .field .line-note { margin-top: 2px; }
    .line-card { border: 1.5px solid var(--accent); }
    .line-card.down { border-color: var(--green); }
    .line-card.up .line-title { color: var(--accent); }
    .line-card.down .line-title { color: var(--green); }
    .line-card:not(:last-child) { margin-bottom: 14px; }
    .line-card.disabled-card { opacity: .5; }
    .line-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .synth-card { border: 1.5px solid #e8a33d; }
    .line-sub { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 6px; }
    .meter-note { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .line-note { grid-column: 1 / -1; font-size: 12px; color: var(--muted); background: var(--panel-2); border-radius: 8px; padding: 8px 12px; margin-top: 4px; }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: .3px;
    }
    select {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid #2e3947;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 13px;
      outline: none;
      -webkit-appearance: none;
    }
    .meters { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .meter-label { font-size: 12px; color: var(--muted); width: 44px; }
    .meter {
      flex: 1; height: 8px; background: var(--panel-2);
      border-radius: 99px; overflow: hidden;
    }
    .meter i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--green), #ffd166 70%, var(--red));
      border-radius: 99px;
      transition: width .05s linear;
    }
    .subs {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .turn {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .line .lang { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .line .text { font-size: 15px; line-height: 1.5; }
    .line.zh .text { color: #cfd8e3; }
    .line.en .text { color: var(--accent); font-weight: 500; }
    .turn.pending .line.en .text { color: var(--muted); font-style: italic; }
    .turn .idx {
      font-size: 11px;
      color: var(--muted);
      align-self: flex-start;
      background: var(--panel-2);
      padding: 2px 8px;
      border-radius: 99px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .voice, .mode { flex: 1; }
    button.primary {
      -webkit-app-region: no-drag;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      padding: 13px 34px;
      cursor: pointer;
    }
    button.primary:hover { filter: brightness(1.1); }
    button.primary.stop { background: var(--red); }
    .hint { font-size: 12px; color: var(--muted); }
    /* 主页状态条 */
    .status-strip { display:flex; align-items:center; gap:10px; padding:10px 16px; }
    .chip { font-size:13px; background:var(--panel-2); border-radius:99px; padding:6px 14px; color:var(--text); }
    .chip.on { color:var(--green); }
    .settings-btn { margin-left:auto; background:var(--panel-2); color:var(--text); border:1px solid #2e3947; border-radius:9px; padding:7px 14px; font-size:13px; cursor:pointer; -webkit-app-region:no-drag; }
    .settings-btn:hover { border-color:var(--accent); }
    .meter-strip { display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; padding:12px 16px; }
    .mini-meter { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
    .mini-meter .meter { flex:1; }
    /* Dialog */
    .dialog-mask { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:100; }
    .dialog-mask.open { display:flex; }
    .dialog { background:var(--panel); border:1px solid #2e3947; border-radius:16px; width:860px; max-width:92vw; max-height:86vh; display:flex; flex-direction:column; }
    .dialog-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid #2e3947; font-size:15px; font-weight:600; }
    .close-btn { background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; }
    .close-btn:hover { color:var(--text); }
    .dialog-body { padding:16px 20px; overflow-y:auto; }
    .dialog-footer { padding:14px 20px; border-top:1px solid #2e3947; display:flex; justify-content:flex-end; }
    .dialog-footer .primary { padding:9px 28px; font-size:13px; }
  </style>
</head>
<body>
  <div class="titlebar">
    <h1>PipeLingo</h1>
    <span class="status" id="status">未开始</span>
  </div>

  <div class="wrap">
    <!-- 主页状态条 -->
    <div class="card status-strip" id="statusStrip">
      <span id="stripUp" class="chip">⬆️ 上行</span>
      <span id="stripDown" class="chip">⬇️ 下行</span>
      <span id="stripVoice" class="chip">🎙️ 我的克隆声音</span>
      <button class="primary" id="startBtn" style="margin-left:auto; padding:8px 22px; font-size:13px;">▶ 开始同传</button>
      <button class="settings-btn" id="openSettings" style="margin-left:0;">⚙️ 设置</button>
    </div>

    <!-- 主页电平总览 -->
    <div class="card meter-strip">
      <div class="mini-meter"><span>🎤 麦克</span><div class="meter"><i id="homeInMeter"></i></div></div>
      <div class="mini-meter"><span>📤 英文</span><div class="meter"><i id="homeOutMeter"></i></div></div>
      <div class="mini-meter"><span>📥 对方</span><div class="meter"><i id="homeRevInMeter"></i></div></div>
      <div class="mini-meter"><span>🀄 中文</span><div class="meter"><i id="homeRevOutMeter"></i></div></div>
    </div>
    <!-- 设备选择 + 电平 -->
    </div>

    <!-- 实时字幕 -->
    <div class="subs" id="subs">
      <div class="turn pending">
        <div class="idx">等待开始…</div>
        <div class="line zh"><div class="lang">原文 · 中文</div><div class="text">开始同传后，每句话会出现在这里。</div></div>
        <div class="line en"><div class="lang">译文 · English</div><div class="text">Interpretation will be paired sentence by sentence.</div></div>
      </div>
    </div>


    <!-- 设置 Dialog -->
    <div class="dialog-mask" id="settingsMask">
      <div class="dialog">
        <div class="dialog-header">
          <span>⚙️ 设置</span>
          <button class="close-btn" id="closeSettings">✕</button>
        </div>
        <div class="dialog-body">
    <div class="line-cards">
      <div class="card line-card up">
        <div class="line-title">⬆️ 上行线路 <span class="line-sub">你说中文 → 英文 → 会议</span></div>
        <div class="field">
          <label>麦克风</label>
          <select id="micSelect"></select>
          <div class="meters">
            <div class="meter"><i id="inMeter"></i></div>
          </div>

          <label style="display:block; font-size:12px; color:var(--muted); margin:8px 0 6px;">输出到会议</label>
          <select id="outSelect">
            <option value="">系统默认输出（耳机/扬声器）</option>
          </select>
          <div class="meters" style="margin-top:8px;">
            <div class="meter"><i id="outMeter"></i></div>
          </div>
          <div style="display:flex; flex-direction:column; gap:6px; margin-top:10px;">
            <label style="font-size:12px; color:var(--muted);">音色（英文合成用）</label>
            <select id="voice">
              <option>我的声音（克隆）</option>
              <option>标准女声</option>
              <option>标准男声</option>
            </select>
          </div>
          <label style="display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--text); cursor:pointer;">
            <input type="checkbox" id="uplinkEnabled" checked style="width:16px; height:16px; accent-color:var(--accent);" /> ⬆️ 启用上行线路
          </label>
          <label style="display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px; color:var(--muted);">
            <input type="checkbox" id="selfMonitor" checked /> 监听：自己也能听到英文
          </label>
        </div>
      </div>
      <div class="card line-card down">
        <div class="line-title">⬇️ 下行线路 <span class="line-sub">对方说外语 → 中文 → 你的耳机</span></div>
        <div class="field">
          <label>对方声音来源 <span class="meter-note">·会议里的英文原声</span></label>
          <select id="revDevice" disabled>
            <option>自动（BlackHole 16ch 优先）</option>
          </select>
          <div class="meters">
            <div class="meter"><i id="revInMeter"></i></div>
            <span class="meter-note">选定设备后实时显示采集信号</span>
          </div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <label style="font-size:12px; color:var(--muted);">音色（中文合成用）</label>
            <select id="voice2" disabled>
              <option>我的声音（克隆）</option>
            </select>
          </div>
          <label style="display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--text); cursor:pointer;">
            <input type="checkbox" id="bidirect" style="width:16px; height:16px; accent-color:var(--green);" /> 🔁 启用下行线路
          </label>
          <div class="line-note">对方说英文 → 实时识别翻译 → 中文语音回放到<b>你的耳机</b>（对方听不到）</div>
        </div>
      </div>


        </div>
        <div class="dialog-footer">
          <button class="primary" id="saveSettings">完成</button>
        </div>
      </div>
    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
