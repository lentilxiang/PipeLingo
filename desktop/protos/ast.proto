syntax = "proto3";

package ast;

enum EventType {
  None = 0;
  StartSession = 100;
  CancelSession = 101;
  FinishSession = 102;
  SessionStarted = 150;
  SessionCanceled = 151;
  SessionFinished = 152;
  SessionFailed = 153;
  UsageResponse = 154;
  TaskRequest = 200;
  UpdateConfig = 201;
  AudioMuted = 250;
  TTSSentenceStart = 350;
  TTSSentenceEnd = 351;
  TTSResponse = 352;
  SourceSubtitleStart = 650;
  SourceSubtitleResponse = 651;
  SourceSubtitleEnd = 652;
  TranslationSubtitleStart = 653;
  TranslationSubtitleResponse = 654;
  TranslationSubtitleEnd = 655;
}

message RequestMeta {
  string Endpoint = 1;
  string AppKey = 2;
  string AppID = 3;
  string ResourceID = 4;
  string ConnectionID = 5;
  string SessionID = 6;
  int32 Sequence = 7;
}

message BillingItem {
  string Unit = 1;
  float Quantity = 2;
}

message Billing {
  repeated BillingItem Items = 1;
  int64 DurationMsec = 2;
  int64 WordCount = 3;
}

message ResponseMeta {
  string SessionID = 1;
  int32 Sequence = 2;
  int32 StatusCode = 3;
  string Message = 4;
  Billing Billing = 5;
}

message User {
  string uid = 1;
  string did = 2;
  string platform = 3;
  string sdk_version = 4;
  string app_version = 5;
}

message Audio {
  string data = 1;
  string url = 2;
  string url_type = 3;
  string format = 4;
  string codec = 5;
  string language = 6;
  int32 rate = 7;
  int32 bits = 8;
  int32 channel = 9;
  bytes binary_data = 14;
}

// 字段号必须与官方 ast_service.proto / au_base.proto 一致，
// 否则 wire 上会落到别的字段（例如 is_custom_speaker 曾误写为 5=speech_rate）。
message Corpus {
  string context = 1;
  string boosting_table_id = 2;
  string boosting_table_name = 3;
  string boosting_id = 4;
  string nnlm_id = 5;
  string correct_table_id = 6;
  string correct_table_name = 7;
  string punc_hot_words = 8;
  repeated string hot_words_list = 9;
  map<string, string> glossary_list = 10;
  string correct_words = 11;
  string regex_correct_table_id = 12;
  string regex_correct_table_name = 13;
  string glossary_table_id = 14;
  string glossary_table_name = 15;
}

// 官方 ast_service.proto:
//   5 speech_rate | 6 enable_source_language_detect
//   7 is_custom_speaker | 8 tts_resource_id
message ReqParams {
  string mode = 1;
  string source_language = 2;
  string target_language = 3;
  string speaker_id = 4;
  int32 speech_rate = 5;
  bool enable_source_language_detect = 6;
  bool is_custom_speaker = 7;
  string tts_resource_id = 8;
  string extra = 80;
  Corpus corpus = 100;
}

message TranslateRequest {
  RequestMeta request_meta = 1;
  EventType event = 2;
  User user = 3;
  Audio source_audio = 4;
  Audio target_audio = 5;
  ReqParams request = 6;
  bool denoise = 7;
}

message TranslateResponse {
  ResponseMeta response_meta = 1;
  EventType event = 2;
  bytes data = 3;
  string text = 4;
  int32 start_time = 5;
  int32 end_time = 6;
  bool spk_chg = 7;
  int32 muted_duration_ms = 8;
  string speaker_id = 9;
  string detected_language = 10;
  double language_confidence = 11;
}
