syntax = "proto3";

package ast;

enum EventType {
  None = 0;
  StartSession = 100;
  CancelSession = 101;
  FinishSession = 102;
  SessionStarted = 150;
  SessionCanceled = 151;
  SessionFinished = 152;
  SessionFailed = 153;
  UsageResponse = 154;
  TaskRequest = 200;
  AudioMuted = 250;
  TTSSentenceStart = 350;
  TTSSentenceEnd = 351;
  TTSResponse = 352;
  SourceSubtitleStart = 650;
  SourceSubtitleResponse = 651;
  SourceSubtitleEnd = 652;
  TranslationSubtitleStart = 653;
  TranslationSubtitleResponse = 654;
  TranslationSubtitleEnd = 655;
}

message RequestMeta {
  string Endpoint = 1;
  string AppKey = 2;
  string AppID = 3;
  string ResourceID = 4;
  string ConnectionID = 5;
  string SessionID = 6;
  int32 Sequence = 7;
}

message ResponseMeta {
  string SessionID = 1;
  int32 Sequence = 2;
  int32 StatusCode = 3;
  string Message = 4;
}

message User {
  string uid = 1;
  string did = 2;
  string platform = 3;
  string sdk_version = 4;
  string app_version = 5;
}

message Audio {
  string data = 1;
  string url = 2;
  string url_type = 3;
  string format = 4;
  string codec = 5;
  string language = 6;
  int32 rate = 7;
  int32 bits = 8;
  int32 channel = 9;
  bytes binary_data = 14;
}

message Corpus {
  string context = 1;
  repeated string hot_words_list = 9;
  string correct_words = 11;
}

message ReqParams {
  string mode = 1;
  string source_language = 2;
  string target_language = 3;
  string speaker_id = 4;
  Corpus corpus = 100;
}

message TranslateRequest {
  RequestMeta request_meta = 1;
  EventType event = 2;
  User user = 3;
  Audio source_audio = 4;
  Audio target_audio = 5;
  ReqParams request = 6;
  bool denoise = 7;
}

message TranslateResponse {
  ResponseMeta response_meta = 1;
  EventType event = 2;
  bytes data = 3;
  string text = 4;
  int32 start_time = 5;
  int32 end_time = 6;
  bool spk_chg = 7;
  int32 muted_duration_ms = 8;
}
